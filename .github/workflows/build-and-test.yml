name: Build and Test

on:
  push:
    branches:
      - "feature/**"
  pull_request:
    branches:
      - dev

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Flutter
        uses: subosito/flutter-action@f2c4032d5e3cf7470058b76fc199042b36b5ec85 # v2.16.0
        with:
          channel: "stable"

      - name: Install dependencies
        run: flutter pub get

      - name: Run analyzer
        run: flutter analyze

      - name: Run tests
        run: flutter test
