name: Frontend CI

on:
  pull_request:
    branches:
      - dev
      - main
    paths:
      - "lib/**"
      - "test/**"
      - "web/**"
      - pubspec.yaml
      - pubspec.lock
      - analysis_options.yaml

permissions:
  contents: read

jobs:
  build-and-test:
    if: >-
      github.base_ref == 'dev' ||
      (github.base_ref == 'main' && github.head_ref == 'dev')
    name: Test and build for ${{ github.base_ref }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: "stable"

      - name: Install dependencies
        run: flutter pub get

      - name: Run analyzer
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build web
        run: flutter build web --release --dart-define=API_BASE_URL=http://localhost:8000/api/v1
