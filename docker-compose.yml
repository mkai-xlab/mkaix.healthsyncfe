services:
  nginx:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        API_BASE_URL: ${API_BASE_URL:-http://localhost:8000/api/v1}
    image: healthsync-fe-nginx:local
    container_name: healthsync-fe-nginx
    ports:
      # HOST_PORT defaults to 8080 for local testing so it doesn't clash
      # with a host nginx already bound to :80. Set HOST_PORT=80 in .env
      # (or `HOST_PORT=80 docker compose up -d`) for the real deployment.
      - "${HOST_PORT:-8080}:80"
    restart: unless-stopped
